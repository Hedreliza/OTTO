[platformio]
default_envs = megaatmega2560

; --- TUDO QUE ESTIVER AQUI SERVE PARA TODAS AS PLACAS ---
[env]
framework = arduino
monitor_speed = 9600
lib_deps =
    wayoda/LedControl @ ^1.0.6
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6
    miguelbalboa/MFRC522 @ ^1.4.12
    chris--a/Keypad @ ^3.1.1
    arduino-libraries/Servo
    z3t0/IRremote @ ^4.7.1

; --- CONFIGURAÇÃO ESPECÍFICA DO UNO ---
[env:uno]
platform = atmelavr
board = uno

; --- CONFIGURAÇÃO ESPECÍFICA DO MEGA ---
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
